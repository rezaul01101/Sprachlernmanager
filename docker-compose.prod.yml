services:
  app:
    build:
      target: production
    image: sprachbahnhof-admin:${IMAGE_TAG:-latest}
    volumes:
      # No source bind mount in production — code is baked into the image for
      # reproducible deploys. .env and storage/ (uploads, logs) still need to
      # survive redeploys, so those two stay bind-mounted from the host.
      - ./.env.docker:/var/www/html/.env
      - ./docker/data/storage:/var/www/html/storage
    restart: always

  mysql:
    restart: always
    # No host port mapping here (unlike the dev override) — MySQL stays
    # reachable only from the app container over the internal network.
