services:
  app:
    volumes:
      # Bind-mount the whole repo so edits on the host show up immediately —
      # except node_modules, which gets its own volume: npm packages here
      # include native binaries (Rolldown/Vite) built for the container's
      # Linux, and would break if shadowed by the host's macOS-built copy.
      - .:/var/www/html
      - node_modules_data:/var/www/html/node_modules
      # The repo's own .env (if present) is for a host-based Herd setup with
      # different DB credentials pointing at a different MySQL entirely — it
      # must not shadow the container's .env. Mounted last so it wins.
      - ./.env.docker:/var/www/html/.env
    ports:
      - "${VITE_PORT:-5183}:5173"

  mysql:
    ports:
      # Host access for local GUI clients (TablePlus, Sequel Ace, etc). Off by
      # default in production — see docker-compose.prod.yml.
      - "${DB_EXPOSE_PORT:-3317}:3306"

volumes:
  node_modules_data:
