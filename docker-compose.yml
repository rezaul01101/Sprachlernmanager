services:
  app:
    build:
      context: .
      target: development
    image: sprachbahnhof-admin:${IMAGE_TAG:-dev}
    container_name: sprachbahnhof_app
    env_file:
      - .env.docker
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: sprachbahnhof_mysql
    restart: unless-stopped
    env_file:
      - .env.docker
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      # Data-safety: MySQL's real data directory lives on the host, not just
      # inside the container's writable layer — surviving `docker compose down`,
      # image rebuilds, and `docker rm`. Only deleting this folder loses data.
      - ./docker/data/mysql:/var/lib/mysql
    networks:
      - laravel

networks:
  laravel:
    driver: bridge
