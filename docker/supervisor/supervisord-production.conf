[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log

[program:nginx]
command=nginx -g "daemon off;"
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.err.log

[program:ssr]
command=php /var/www/html/artisan inertia:start-ssr
directory=/var/www/html
autorestart=true
priority=15
stdout_logfile=/var/log/supervisor/ssr.log
stderr_logfile=/var/log/supervisor/ssr.err.log

[program:mysql-backup]
command=/usr/local/bin/backup.sh
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/backup.log
stderr_logfile=/var/log/supervisor/backup.err.log
